# Plesk → Sitios web y dominios → news.agentes.natulaboratories.es → Configuración de Apache y nginx
# Pegar en "Directivas adicionales para HTTP" y en "Directivas adicionales para HTTPS".
ProxyPreserveHost On
ProxyPass /.well-known/acme-challenge !
ProxyPass / http://127.0.0.1:3002/ timeout=180
ProxyPassReverse / http://127.0.0.1:3002/
RequestHeader set X-Forwarded-Proto "https"
